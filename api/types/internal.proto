syntax = "proto3";

package types;

import "tagger/tagger.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/olive-io/olive/api/types;types";
option java_multiple_files = true;
option java_package = "io.olive.api.types";
option java_outer_classname = "OliveTypes";
option (gogoproto.goproto_unkeyed_all) = false;
option (gogoproto.goproto_unrecognized_all) = false;
option (gogoproto.goproto_sizecache_all) = false;
option (gogoproto.goproto_getters_all) = false;

message ResponseHeader {
  uint64 clusterID = 1;
  uint64 memberID = 2;
  int64  revision = 3;
  uint64 raftTerm = 4;
}

message Member {
  // ID is the member ID for this member.
  uint64 id = 1;

  // Name is the human-readable name of the member. If the member is not started, the name will be an empty string.
  string name = 2;

  // PeerURLs is the list of URLs the member exposes to the cluster for communication.
  repeated string peer_urls = 3;

  // ClientURLs is the list of URLs the member exposes to clients for communication. If the member is not started, clientURLs will be empty.
  repeated string client_urls = 4;

  // isLearner indicates if the member is raft learner.
  bool is_leader = 5;
}

// Monitor means olive-server, the monitor component of olive system
message Monitor {
  uint64 cluster_id = 1;

  uint64 leader = 2;

  uint64 raftTerm = 3;

  repeated Member members = 4;
}

// Runner means olive-runner, the runner component of olive system
message Runner {
  enum TransportType {
    GRPCStream = 0;
    GRPCEcho = 1;
    Http = 2;
  }

  uint64 id = 1 [(tagger.tags) = "gorm:\"primary\""];

  // Unique identified by runner
  string uid = 2;

  // Name is the human-readable name of the runner.
  string name = 3;

  // listenURL is the URL the runner is listening on.
  string listenURL = 4;

  string version = 5;

  int64 heartbeatMs = 6;

  string hostname = 7;

  map<string, string> metadata = 8;

  map<string, string> features = 9;

  TransportType transport = 10;

  uint64 cpu = 11;

  uint64 memory = 12;
}

message RunnerStat {
  uint64 id = 1;

  string uid = 2;

  double cpuUsed = 3;

  double memoryUsed = 4;

  string state = 5;

  string error = 6;

  int64 timestamp = 7;

  uint64 steps = 11;
  uint64 commit_count = 12;
  uint64 rollback_count = 13;
  uint64 destroy_count = 14;
}

message ExecuteProcessMsg {
  int64 process = 1;
}

message RunnerEvent {
  ExecuteProcessMsg executeProcess = 1;
}
