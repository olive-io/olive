syntax = "proto3";

package types;

import "tagger/tagger.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/olive-io/olive/api/types;types";
option java_multiple_files = true;
option java_package = "io.olive.api.types";
option java_outer_classname = "OliveTypes";
option (gogoproto.goproto_unkeyed_all) = false;
option (gogoproto.goproto_unrecognized_all) = false;
option (gogoproto.goproto_sizecache_all) = false;
option (gogoproto.goproto_getters_all) = false;

enum FlowNodeType {
  UnknownNode = 0;
  StartEvent = 1;
  EndEvent = 2;
  BoundaryEvent = 3;
  IntermediateCatchEvent = 4;

  Task = 11;
  SendTask = 12;
  ReceiveTask = 13;
  ServiceTask = 14;
  UserTask = 15;
  ScriptTask = 16;
  ManualTask = 17;
  CallActivity = 18;
  BusinessRuleTask = 19;
  SubProcess = 20;

  EventBasedGateway = 31;
  ExclusiveGateway = 32;
  InclusiveGateway = 33;
  ParallelGateway = 34;
}

// Definitions bpmn Definition
message Definitions {
  int64 id = 1 [(tagger.tags) = "gorm:\"primary\""];

  int64 createAt = 2 [(tagger.tags) = "gorm:\"autoCreateTime\""];

  int64 updateAt = 3 [(tagger.tags) = "gorm:\"autoUpdateTime\""];

  string uid = 4 [(tagger.tags) = "gorm:\"index\""];

  string description = 5;

  map<string, string> metadata = 6 [(tagger.tags) = "gorm:\"serializer:json\""];

  string content = 7;

  uint64 version = 8;

  bool isExecute = 9;
}

message DefinitionsSnapshot {
  int64 id = 1 [(tagger.tags) = "gorm:\"primary\""];

  int64 createAt = 2 [(tagger.tags) = "gorm:\"autoCreateTime\""];

  string uid = 3 [(tagger.tags) = "gorm:\"index\""];

  string description = 4;

  map<string, string> metadata = 5 [(tagger.tags) = "gorm:\"serializer:json\""];

  string content = 6;

  uint64 version = 7;
}

message BpmnArgs {
  map<string, string> headers = 1;

  map<string, bytes> properties = 2;

  map<string, bytes> dataObjects = 3;
}

enum ProcessStatus {
  Unknown = 0;
  // to be 'Prepare' where Process created
  Prepare = 1;
  // to be 'Ready' where olive-server scheduled
  Ready = 2;
  Commit = 3;
  Destroy = 4;
  Rollback = 5;
  Failed = 6;
  Success = 7;
}

message Process {
  int64 id = 1 [(tagger.tags) = "gorm:\"primary\""];

  int64 createAt = 2 [(tagger.tags) = "gorm:\"autoCreateTime\""];

  int64 updateAt = 3 [(tagger.tags) = "gorm:\"autoUpdateTime\""];

  string name = 4;

  string uid = 5;

  map<string, string> metadata = 6 [(tagger.tags) = "gorm:\"serializer:json\""];

  int64 priority = 7;

  BpmnArgs args = 8 [(tagger.tags) = "gorm:\"serializer:json\""];

  int64 definitionsId = 9;

  uint64 definitionsVersion = 10;

  string definitionsProcess = 11;

  string definitionsContent = 12;

  ProcessContext context = 13 [(tagger.tags) = "gorm:\"serializer:json\""];

  int32 attempts = 14;

  int64 startAt = 15;

  int64 endAt = 16;

  ProcessStatus status = 17;

  string err_msg = 18;
}

message ProcessContext {
  map<string, bytes> variables = 1;

  map<string, bytes> dataObjects = 2;
}

message FlowNode {
  enum FlowNodeState {
    Unknown = 0;
    Commit = 1;
    Destroy = 2;
    Rollback = 3;
    Failed = 4;
    Success = 5;
  }

  string id = 1 [(tagger.tags) = "gorm:\"primary\""];

  int64 createAt = 2 [(tagger.tags) = "gorm:\"autoCreateTime\""];

  string name = 3;

  string flow_id = 4;

  FlowNodeType flow_type = 5;

  ProcessContext context = 6 [(tagger.tags) = "gorm:\"serializer:json\""];

  int32 retries = 7;

  int64 startTime = 8;

  int64 endTime = 9;

  int64 process_id = 10 [(tagger.tags) = "gorm:\"index\""];

  FlowNodeState state = 11;

  string err_msg = 12;
}
